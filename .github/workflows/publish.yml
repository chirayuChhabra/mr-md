name: CI/CD

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Check Formatting & Lint
        run: bunx biome ci .

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "::error::Tag version $TAG_VERSION does not match package version $PACKAGE_VERSION."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js (for npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Determine npm tag
        id: get-tag
        run: |
          # Extract the version from the git tag (e.g., v1.0.0-beta.1 -> 1.0.0-beta.1)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Version is $VERSION"
          
          # Determine the npm tag (lane)
          if [[ $VERSION == *"-"* ]]; then
            # Extract everything after the first dash, then get the part before the first dot
            # e.g., beta.1 -> beta
            LANE=$(echo "$VERSION" | cut -d'-' -f2 | cut -d'.' -f1)
          else
            LANE="latest"
          fi
          
          echo "npm tag will be: $LANE"
          echo "npm_tag=$LANE" >> $GITHUB_ENV

      - name: Publish to npm
        run: npm publish --tag ${{ env.npm_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
